name: Generate Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Generate Stats
        uses: anuraghazra/github-readme-stats@deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: samoilov2004
          show_icons: true
          theme: radical

      - name: Generate Top Languages
        uses: anuraghazra/github-readme-stats@deploy
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: samoilov2004
          layout: compact
          theme: radical

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Stats Bot"
          git config --global user.email "bot@github.com"
          git add -A
          git commit -m "Update stats" || exit 0
          git push
